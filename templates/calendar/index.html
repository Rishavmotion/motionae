<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Calendar Event</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="motionkit.js"></script>
<style>
  /* Apple-style month view. Change the look here; change the content in CONFIG below. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F5F5F7; }
  #root { --ground: #F5F5F7; --main: #F04E63; --ink: #1D1D1F; --event: #B65CF2;
          position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground);
          color: var(--ink); font-family: system-ui, sans-serif; }
  .cal { position: absolute; inset: 0; transform-origin: 960px 560px; }
  .abs { position: absolute; }
  .icon { position: absolute; overflow: visible; fill: none; stroke: var(--main); stroke-linecap: round; stroke-linejoin: round; }
  .year { font-size: 42px; color: var(--main); white-space: nowrap; }
  .month { font-size: 88px; font-weight: 700; letter-spacing: -0.025em; color: var(--main); white-space: nowrap; line-height: 1; }
  .wd { width: 80px; margin-left: -40px; text-align: center; font-size: 24px; font-weight: 600; }
  .day { width: 96px; height: 72px; margin: -36px 0 0 -48px; display: flex; align-items: center; justify-content: center;
         font-size: 46px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .off { color: color-mix(in srgb, var(--ink) 45%, var(--ground)); }
  .dot { width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: var(--main); }
  .ev { transform-origin: 0 0; }
  .ev-tail { position: absolute; left: -22px; top: 0; width: 44px; height: 24px; overflow: visible; }
  .ev-body { position: absolute; top: 22px; left: 0; height: 108px; border-radius: 54px; display: flex; align-items: center; gap: 22px;
             padding: 0 44px 0 14px; white-space: nowrap; transform: translateX(-50%);
             background: color-mix(in srgb, var(--event) 38%, var(--ground)); }
  .ev-disc { width: 84px; height: 84px; border-radius: 50%; background: var(--event); display: flex; align-items: center; justify-content: center; flex: none; }
  .ev-title { font-size: 42px; font-weight: 600; letter-spacing: -0.015em; color: color-mix(in srgb, var(--event) 62%, var(--ink)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="8"></div>
<script>
// ---------------------------------------------------------------- CONFIG (edit me)
const CONFIG = { year: 2026, month: 10 /* 0 = January */, highlight: 12, event: 'Production Day', dur: 8 };

// ---------------------------------------------------------------- build (once)
const { seg, eo, eio, eb, lerp } = MK;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const FIRST = new Date(CONFIG.year, CONFIG.month, 1).getDay();             // date math, not a clock
const DAYS = new Date(CONFIG.year, CONFIG.month + 1, 0).getDate();
const ROWS = Math.ceil((FIRST + DAYS) / 7), GAP = ROWS > 5 ? 88 : 100;
const COL = i => 576 + i * 128, ROW = r => 450 + r * GAP;
const HI = CONFIG.highlight - 1 + FIRST, HC = HI % 7, HR = Math.floor(HI / 7);

let h = '<div class="cal">' +
  '<svg class="icon back" width="44" height="44" style="left:520px;top:149px" viewBox="0 0 44 44" stroke-width="5"><path d="M28 6 L12 22 L28 38"/></svg>' +
  '<div class="abs year" style="left:570px;top:146px">' + CONFIG.year + '</div>' +
  '<svg class="icon ic" width="60" height="52" style="left:1058px;top:145px" viewBox="0 0 60 52" stroke-width="4"><rect x="3" y="4" width="54" height="20" rx="7"/><rect x="3" y="28" width="54" height="20" rx="7"/><path d="M13 14 H35 M13 38 H31"/></svg>' +
  '<svg class="icon ic" width="56" height="56" style="left:1187px;top:143px" viewBox="0 0 56 56" stroke-width="4.5"><circle cx="23" cy="23" r="17"/><path d="M36 36 L51 51"/></svg>' +
  '<svg class="icon ic" width="50" height="50" style="left:1316px;top:146px" viewBox="0 0 50 50" stroke-width="4.5"><path d="M25 3 V47 M3 25 H47"/></svg>' +
  '<div class="abs month" style="left:556px;top:226px">' + MONTHS[CONFIG.month] + '</div>';
['S','M','T','W','T','F','S'].forEach((w, i) => { h += '<div class="abs wd' + (i ? '' : ' off') + '" style="left:' + COL(i) + 'px;top:346px">' + w + '</div>'; });
h += '<div class="abs dot" style="left:' + COL(HC) + 'px;top:' + ROW(HR) + 'px"></div>';
for (let d = 1; d <= DAYS; d++) { const i = d - 1 + FIRST;
  h += '<div class="abs day' + (i % 7 ? '' : ' off') + '" style="left:' + COL(i % 7) + 'px;top:' + ROW(Math.floor(i / 7)) + 'px">' + d + '</div>'; }
h += '<div class="abs ev" style="left:' + COL(HC) + 'px;top:' + (ROW(HR) + 46) + 'px">' +
  '<svg class="ev-tail" viewBox="0 0 44 24"><path d="M0 24 L22 0 L44 24 Z" style="fill:color-mix(in srgb, var(--event) 38%, var(--ground))"/></svg>' +
  '<div class="ev-body"><div class="ev-disc"><svg width="48" height="48" viewBox="0 0 48 48" style="fill:none;stroke:var(--ground);stroke-width:3.5;stroke-linejoin:round"><path d="M6 16 H14 L18 10 H30 L34 16 H42 V38 H6 Z"/><circle cx="24" cy="26.5" r="7"/></svg></div>' +
  '<div class="ev-title">' + CONFIG.event + '</div></div></div></div>';
const root = document.getElementById('root');
root.appendChild(MK.h(h));
const $ = s => MK.$(s, root), $$ = s => MK.$$(s, root);
const cal = $('.cal'), ics = $$('.ic'), wds = $$('.wd'), dot = $('.dot'), ev = $('.ev'), disc = $('.ev-disc'), evt = $('.ev-title');
const days = $$('.day').map((el, k) => ({ el, r: Math.floor((k + FIRST) / 7), c: (k + FIRST) % 7 }));
const hl = days[CONFIG.highlight - 1].el;

// ---------------------------------------------------------------- render(t): pure function of time
function render(t) {
  cal.style.transform = 'scale(' + (1 + 0.018 * eio(seg(t, 0.5, CONFIG.dur))) + ')';      // slow push: nothing is ever frozen
  MK.reveal($('.back'), t, -0.55, { d: .5, x: 18, blur: 8 });
  MK.reveal($('.year'), t, -0.5, { d: .5, x: 16, blur: 8 });
  ics.forEach((el, i) => MK.reveal(el, t, -0.4 + i * 0.08, { d: .42, s: .5, pop: 1.8, blur: 0 }));
  MK.typeOn($('.month'), t, -0.45, { cps: 14, band: 4 });                                 // frame 0 already shows the title
  wds.forEach((el, i) => MK.reveal(el, t, 0.45 + i * 0.03, { d: .4, y: 10, blur: 4 }));
  const push = 140 * eio(seg(t, 2.85, 3.35));                                              // rows below make room
  days.forEach(d => { MK.reveal(d.el, t, 0.75 + d.r * 0.13 + d.c * 0.025, { d: .45, y: 16, blur: 6 });
    if (d.r > HR) d.el.style.transform += ' translateY(' + push + 'px)'; });
  const pd = seg(t, 2.35, 2.75);
  dot.style.opacity = eo(seg(t, 2.35, 2.45));
  dot.style.transform = 'scale(' + (pd > 0 ? lerp(.2, 1, eb(pd, 1.8)) : 0) + ')';
  hl.style.color = t > 2.45 ? 'var(--ground)' : ''; hl.style.fontWeight = t > 2.45 ? '600' : '';
  MK.reveal(ev, t, 3.05, { d: .45, s: .3, pop: 1.7, blur: 0, wobble: 9 });
  if (t > 4) ev.style.transform += ' scale(' + MK.breathe(t - 4, .008) + ')';
  MK.reveal(disc, t, 3.25, { d: .35, s: .4, pop: 1.8, blur: 0 });
  MK.reveal(evt, t, 3.35, { d: .5, x: 26, blur: 6 });
}

MK.film({ id: 'main', dur: CONFIG.dur, render });
</script>
</body>
</html>
